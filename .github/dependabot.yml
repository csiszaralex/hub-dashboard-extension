# Weekly, grouped, so updates arrive as two pull requests a week at most rather
# than one per package. Actions are pinned by commit SHA; Dependabot updates the
# SHA and the version comment together. The prefixes keep the messages inside
# the scopes commitlint accepts.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Majors change behaviour and are upgraded deliberately, one at a time.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # A package joins the first group that matches it. The toolchain that
    # builds, tests and ships the code gets its own pull request, so a change
    # there is reviewed on its own instead of hiding among routine bumps; the
    # first run bundled the CRXJS beta-to-stable move with 28 small updates.
    groups:
      toolchain:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - '@crxjs/*'
          - 'vitest'
          - 'happy-dom'
          - 'typescript'
          - 'typescript-eslint'
          - 'eslint'
          - '@eslint/*'
          - 'nx'
          - '@nx/*'
          - 'wrangler'
          - '@cloudflare/*'
      runtime:
        # What ships to users: a change here is seen on every new tab.
        patterns:
          - 'react'
          - 'react-dom'
          - 'i18next'
          - 'react-i18next'
          - 'lucide-react'
          - 'date-fns'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'hono'
      dependencies:
        patterns: ['*']
    commit-message:
      # commitlint allows these scopes only (commitlint.config.js).
      prefix: chore(repo)

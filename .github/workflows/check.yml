name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected diffs against the base branch, which needs its history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pull request only checks what it touched; a push to main checks
      # everything, because release.yml starts from this run's success and
      # tags the commit it passed.
      - name: Check affected projects
        if: github.event_name == 'pull_request'
        run: pnpm nx affected --base=origin/${{ github.base_ref }} -t typecheck lint test build

      - name: Check all projects
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t typecheck lint test build

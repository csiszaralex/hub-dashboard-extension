name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nx affected diffs against the base branch, which needs its history.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A pull request only checks what it touched; a push to main checks
      # everything, because release.yml starts from this run's success and
      # tags the commit it passed.
      - name: Check affected projects
        if: github.event_name == 'pull_request'
        run: pnpm nx affected --base=origin/${{ github.base_ref }} -t typecheck lint test build

      - name: Check all projects
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t typecheck lint test build

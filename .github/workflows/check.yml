name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the job's token is read-only.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nx affected diffs against the base branch, which needs its history.
          fetch-depth: 0
          # No later step talks to the remote, so the token is not kept on the
          # runner for the dependency scripts that run next.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not an Nx project, so neither `affected` nor `run-many` reaches it; it
      # is small enough to test on every run.
      - name: Test workflow scripts
        run: node --test .github/scripts/*.test.mjs

      # A pull request only checks what it touched; a push to main checks
      # everything, because release.yml starts from this run's success and
      # tags the commit it passed.
      - name: Check affected projects
        if: github.event_name == 'pull_request'
        run: pnpm nx affected --base=origin/${{ github.base_ref }} -t typecheck lint test build

      - name: Check all projects
        if: github.event_name != 'pull_request'
        run: pnpm nx run-many -t typecheck lint test build

name: Deploy Extension

on:
  push:
    tags:
      - 'extension@*'

# The upload goes to the Chrome Web Store with its own credentials; nothing
# writes to the repository, so the job's token is read-only.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag cut by release.yml sits on a tree Check has passed. A tag pushed
      # by hand (a hotfix, a re-tag) has had no such run, and this workflow
      # cannot tell the two apart.
      - name: Check all projects
        run: pnpm run check

      - name: Build and Pack
        run: pnpm nx run extension:pack

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: apps/extension/extension-release.zip
          extension-id: ${{ secrets.EXTENSION_ID }}
          # Chrome Web Store API v2 addresses items under their publisher. An
          # identifier, not a credential, so it is a variable, not a secret.
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: ${{ vars.PUBLISH_EXTENSION == 'true' }}

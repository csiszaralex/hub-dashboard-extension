name = "hub-api"
compatibility_date = "2024-03-20"

[[kv_namespaces]]
binding = "UNSPLASH_CACHE"
id = "a3a6ba1a2f0b49ffb5b34beb9f32af9c"
preview_id = "1a8f624136ed488e975f693be485f1eb"

# Workers Logs keeps the worker's own console output, which is how a failing
# upstream gets noticed at all. Per-request invocation logs stay off: they
# record each request's URL, which carries the user's background tags and
# quote category, and privacy-policy.md promises no request logs.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
